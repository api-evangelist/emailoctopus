            - type: string
              title: Single Choice
              description: The value for a "choice_single" field.
            - type: Array of strings
              title: Multiple Choice
              description: The value for a "choice_multiple" field.
          example:
            referral: Otto
            birthday: '2015-12-01'
            how_many_pets: 2
        tags:
          type: array
          description: An array of tags associated with the contact.
          items:
            type: string
            example: vip
        status:
          type: string
          description: The status of the contact.
          example: subscribed
          enum:
          - pending
          - subscribed
          - unsubscribed
