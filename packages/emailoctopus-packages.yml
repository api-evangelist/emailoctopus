summary: >-
  EmailOctopus publishes no first-party REST client SDK. Their own SDK page states
  verbatim: "While we don't yet have an official SDK, you should find that our API
  plays nicely with any REST client in your chosen language." The page then lists
  six community-maintained libraries and explicitly disclaims them as "unofficial
  and have not been tested or verified by the team." The only first-party
  distributable package EmailOctopus ships is its own WordPress plugin, published
  under the emailoctopus.com WordPress.org author account.
official_client_library_count: 0
first_party_package_count: 1
community_sdk_count: 7
sdk_pointer_emitted: false
sdk_pointer_reason: >-
  No `type: SDKs` pointer is wired for EmailOctopus. The provider states on its own
  SDK page that it ships no official SDK, and the one first-party package (the
  WordPress plugin) is an end-user integration, not an API client library. Emitting
  an SDK pointer here would credit EmailOctopus with a client library it does not
  publish.
notes:
  - >-
    Currency signal: every community library on the vendor's own SDK page predates
    the v2 API launch (2024-10-07) except the npm emailoctopus-api-client
    (2.0.4, 2025-09-29) and the PHP client (v1.0.4, 2025-01-18). The Ruby gem
    (0.1.0, 2016-12-05) and the older Node wrapper (1.1.2, 2017-02-03) are v1-era
    and are listed here because the provider still links them, not because they
    are current.
  - >-
    No PyPI package exists for the Python library EmailOctopus links; it is
    distributed as a GitHub repository only, so there is no registry metadata
    endpoint to read a version from.
