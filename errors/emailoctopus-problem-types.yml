format: rfc7807
format_note: >-
  EmailOctopus states verbatim in its own API reference: "Error are returned in a
  standardised format following RFC 7807." Validation failures add an `errors[]`
  array of `{pointer|parameter, detail}` objects and are described as "a payload
  formatted according to RFC 9457". The response media type observed on the live API
  is `application/json`, NOT `application/problem+json` — the envelope follows the
  RFC but the content type does not, which is worth noting for any client that
  content-negotiates on problem+json.
envelope:
  media_type: application/json
  fields:
    - name: type
      description: Absolute URI naming the problem type; dereferences to the documented section.
    - name: title
      description: General error title. Always the literal string "An error occurred."
    - name: detail
      description: Human-readable description of this occurrence.
    - name: status
      description: HTTP status code, repeated in the body.
    - name: errors
      description: >-
        Present on 422 only. Array of {pointer (JSON Pointer, RFC 6901), parameter
        (URL parameter name), detail} validation failures.
  example_probed: |
    {"title":"An error occurred.","detail":"Invalid key.","status":401,
     "type":"https://emailoctopus.com/api-documentation/v2#unauthorized"}
type_uri_scheme: https://emailoctopus.com/api-documentation/v2#<slug>
problems:
