      summary: Create or update contact
      description: This is an *upsert* endpoint. If the contact does not exist, it will be created. If the contact already exists, it will be updated.
      parameters:
      - name: list_id
        in: path
        description: The ID of the list.
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
        example: 00000000-0000-0000-0000-000000000000
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              description: ''
              deprecated: false
              required:
              - email_address
              properties:
                email_address:
                  type: string
                  description: The email address of the contact.
                  example: otto@example.com
                fields:
                  type: object
                  description: An object containing key/value pairs of field values, using the field's tag as the key.
                  additionalProperties:
                    description: The value of the field.
                    x-additionalPropertiesName: field tag
                    anyOf:
                    - type: string
                      title: Text
                      description: The value for a "text" field.
                    - type: integer
                      title: Number
                      description: The value for a "number" field.
                    - type: string
                      title: Date
                      description: The value for a "date" field.
                    - type: string
                      title: Single Choice
                      description: The value for a "choice_single" field.
                    - type: Array of strings
                      title: Multiple Choice
                      description: The value for a "choice_multiple" field.
                    - type: 'null'
                      title: Unset
                      description: Remove the field from the contact.
                  example:
                    referral: Otto
                    birthday: '2015-12-01'
                    how_many_pets: 2
                    fieldToRemove: null
                tags:
                  type: object
                  description: An object containing key/value pairs, where the key is the tag name and the value is true to add the tag or false to remove it. Tags that are not referenced in the object will not be updated.
                  additionalProperties:
                    type: boolean
                  example:
                    vip: true
                    tagToRemove: false
                status:
                  type: string
                  description: The status of the contact.
                  example: subscribed
                  enum:
                  - pending
                  - subscribed
                  - unsubscribed
        required: false
