name: EmailOctopus
kind: company
description: EmailOctopus is an affordable email-marketing platform for newsletters, campaigns, automations
  and audience management, built on a low-cost sending model that undercuts the incumbent ESPs. Its v2
  REST API is served from a single host, https://api.emailoctopus.com, with no version segment in the
  path, and is authenticated with a Bearer API key. The API covers subscriber lists, contacts, per-list
  custom fields and tags, campaigns and three campaign report projections, plus an operation to enqueue
  a contact into an automation. EmailOctopus publishes a real OpenAPI 3.1.0 document (25 operations, 19
  schemas) at its v2 reference URL, documents an RFC 7807 error envelope with dereferenceable type URIs,
  cursor pagination, a token-bucket rate limit of 10 requests per second with a burst of 100, and an HMAC-SHA256-signed
  webhook surface carrying eight contact event types. It ships no official client SDK, no CLI and no MCP
  server.
