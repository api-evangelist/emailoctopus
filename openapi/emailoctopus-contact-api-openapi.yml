      summary: Get contacts
      description: ''
      parameters:
      - name: list_id
        in: path
        description: The ID of the list.
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
        example: 00000000-0000-0000-0000-000000000000
      - name: limit
        in: query
        description: Max number of results per page.
        required: false
        deprecated: false
        schema:
          type: integer
          default: '100'
        style: form
        explode: true
        example: '100'
      - name: starting_after
        in: query
        description: Cursor that points to the end of the page.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: true
        example: WyIyMDI0LTEyLTA3VDE1OjAzOjAxKzAwOjAwIiwiNDYzN2RmYTAtYjZmMC0xMWVmLWFjZDYtZjU5YjA4MDFlMjBkIl0
      - name: tag
        in: query
        description: The tag associated with the contact.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: true
        example: vip
      - name: status
        in: query
        description: The status of the contact.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - subscribed
          - unsubscribed
          - pending
          default: subscribed
        style: form
        explode: true
        example: subscribed
      - name: created_at.lte
        in: query
        description: Filter by creation date - less than or equal to. ISO 8601 date format.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: true
        example: '2024-01-19T12:14:28Z'
      - name: created_at.gte
        in: query
        description: Filter by creation date - greater than or equal to. ISO 8601 date format.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: true
        example: '2024-01-19T12:14:28Z'
      - name: last_updated_at.lte
        in: query
        description: Filter by update date - less than or equal to. ISO 8601 date format.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: true
        example: '2024-01-19T12:14:28Z'
      - name: last_updated_at.gte
