versioning:
  scheme: key-bound
  current: v2
  released: '2024-10-07'
  docs: https://emailoctopus.com/api-documentation/v2
  note: >-
    No version segment appears in the URL. Which version an integration talks to is
    determined by the API KEY: keys issued before 2024-10-07 are labelled "legacy" and
    speak v1; keys issued after are described by EmailOctopus as "compatible with all
    versions of the API". This is an unusual versioning contract and worth flagging —
    a client cannot tell from the request URL which version it is calling.
deprecation:
  policy_url: https://emailoctopus.com/api-documentation
  sunset_header: false
  deprecation_header: false
  sunset_date: null
  status: >-
    v1 is declared legacy but is NOT scheduled for shutdown. The v1 reference carries
    the banner: "This version of the API (v1) is now considered legacy and is no longer
    actively maintained. We recommend migrating to API v2 for new features,
    improvements, and ongoing support." The knowledge base adds: "If you're using our
    legacy API, it will remain working as usual - no action is required from your end."
  note: >-
    EmailOctopus publishes a deprecation POSITION (a named legacy version with a
    documented migration target) but no dated deprecation POLICY, no notice window, and
    no RFC 8594 Sunset/Deprecation response headers. No Sunset or Deprecation header was
    present on any live probe.
