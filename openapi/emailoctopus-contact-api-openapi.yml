openapi: 3.2.0
info:
  title: EmailOctopus v2 Contact API
  description: '# Introduction


    The EmailOctopus API allows you to manage resources and perform actions within the platform programmatically.'
  version: 2.0.0
  x-logo:
    url: /build/images/logo.CRVwHzot.svg
    altText: EmailOctopus Logo
    href: '#'
servers:
- url: https://api.emailoctopus.com
  description: ''
security:
- api_key: []
tags:
- name: Contact
  description: 'A contact represents an individual person within a list. For instance someone who has subscribed to your weekly newsletter.

    Contacts contain essential information such as their email address, name and any additional data you have collected.

    Contacts can also have tags, participate in automations and receive campaigns.'
paths:
  /lists/{list_id}/contacts:
