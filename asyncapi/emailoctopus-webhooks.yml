spec_note: >-
  EmailOctopus publishes NO AsyncAPI document. The event surface is real and fully
  documented in prose, so this file captures the webhook catalog and apis.yml carries a
  `Webhooks` pointer only — no `AsyncAPI` pointer, because no AsyncAPI exists and
  authoring one on the provider's behalf would misrepresent what they publish.
  The published OpenAPI 3.1.0 also declares no `webhooks` object.
surface: webhooks
transport: https-post
delivery:
  method: POST
  content_type: application/json
  payload_shape: array
  max_events_per_request: 1000
  buffering: >-
    Events are buffered for up to one minute before being sent, so a single request can
    carry many events.
  endpoints_per_team: 2
  retries: >-
    Failed deliveries are retried up to 9 times over approximately 10 days with
    escalating delays between attempts.
security:
  signature_header: EmailOctopus-Signature
  algorithm: HMAC-SHA256
  signature_format: 'sha256=<hex digest>'
  signed_payload: the raw request body
  secret: per-webhook secret value shown when the webhook is created
  note: >-
    Verbatim from the docs: the signature is computed with the "HMAC-SHA256 algorithm
    with the request body as the data and a secret value" as the key, prefixed with
    "sha256=".
configuration:
  requirement: an HTTPS endpoint that accepts a JSON request body
  filters:
    - Select which event types the endpoint receives.
    - Optionally exclude events generated via the API or via an import.
events:
