      valid JSON.
  - status: 401
    type: https://emailoctopus.com/api-documentation/v2#unauthorized
    slug: unauthorized
    title: An error occurred.
    detail: Invalid key.
    remediation: >-
      The API key provided in the request is either invalid or missing. Ensure you are
      using the correct API key and that it is included in the Authorization header as
      a Bearer token. API keys created before 2024-10-07 are labelled legacy and must
      be regenerated to work with v2.
    probed: true
    probe_note: Observed live on GET https://api.emailoctopus.com/lists with an invalid bearer token.
  - status: 403
    type: https://emailoctopus.com/api-documentation/v2#access-denied
    slug: access-denied
    title: An error occurred.
    detail: Access denied.
    remediation: >-
      You do not have permission to access the requested entity, such as trying to get
      the contacts in a list belonging to another account. Check that the API key
      belongs to the account you are trying to access — verify by comparing the last
      four characters of the key against the account's API keys.
  - status: 404
    type: https://emailoctopus.com/api-documentation/v2#not-found
    slug: not-found
    title: An error occurred.
    detail: Resource not found.
    remediation: >-
      The resource could not be found, typically from an invalid list ID or contact ID.
      Double-check the resource identifiers against your EmailOctopus account.
    probed: true
    probe_note: Observed live on GET https://api.emailoctopus.com/nonexistent-xyz.
  - status: 405
    type: https://emailoctopus.com/api-documentation/v2#method-not-allowed
    slug: method-not-allowed
    title: An error occurred.
    remediation: >-
      The HTTP method used is not supported for that endpoint (for example POST on a
      GET-only endpoint). Check the reference for the methods each operation allows.
  - status: 409
    type: https://emailoctopus.com/api-documentation/v2#already-exists
    slug: already-exists
    title: An error occurred.
    remediation: >-
      You are creating an entity that already exists (a duplicate tag on a list, or a
      contact already on the list). Check before creating, or use the upsert endpoint
      api_lists_list_idcontacts_put (create or update contact) which updates when the
      entity exists and creates when it does not.
  - status: 409
    type: https://emailoctopus.com/api-documentation/v2#conflict
    slug: conflict
    title: An error occurred.
    remediation: This request conflicts with the system state. EmailOctopus asks you to contact support.
  - status: 415
    type: https://emailoctopus.com/api-documentation/v2#unsupported-media-type
    slug: unsupported-media-type
    title: An error occurred.
    remediation: >-
      Requests carrying a JSON body must set Content-Type: application/json.
  - status: 422
    type: https://emailoctopus.com/api-documentation/v2#unprocessable-content
    slug: unprocessable-content
    title: An error occurred.
    detail: Unprocessable content.
    remediation: >-
      The JSON payload does not meet the required criteria. Read the errors[] array —
