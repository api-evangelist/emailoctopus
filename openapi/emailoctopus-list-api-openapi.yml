components:
  schemas:
    List-get:
      type: object
      properties:
        id:
          type: string
          description: The ID of the list.
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          description: The name of the list.
          example: New clients list
          maxLength: 255
        double_opt_in:
          type: boolean
          description: If double opt-in has been enabled on the list.
          example: false
        fields:
          type: array
          description: List of available fields
          items:
            oneOf:
            - title: Text, number or date field
              description: A field that accepts a single value.
              type: object
              properties:
                label:
                  type: string
                  description: A human readable label for the field.
                  example: What is your hometown?
                tag:
                  type: string
                  description: The ID used to reference the field in your emails.
                  example: Hometown
                type:
                  type: string
                  description: The type of the field.
                  example: text
                  enum:
                  - text
                  - number
                  - date
                fallback:
                  type:
                  - string
                  - null
                  description: A default value for the field, used in campaigns when there is no other value available.
                  example: Unknown
              required:
              - label
              - tag
              - type
            - title: Choice field
              description: A field that accepts a single value from a list of choices.
              type: object
              properties:
                label:
                  type: string
                  description: A human readable label for the field.
                  example: What is your hometown?
                tag:
                  type: string
                  description: The ID used to reference the field in your emails.
                  example: Hometown
                type:
                  type: string
                  description: The type of the field.
                  example: choice_single
                  enum:
                  - choice_single
                  - choice_multiple
                choices:
                  type: array
                  description: An array of choices for the field.
                  items:
                    type: string
                  example:
                  - One
                  - Two
                fallback:
                  type:
                  - string
                  - null
                  description: A default value for the field, used in campaigns when there is no other value available.
                  example: Unknown
              required:
              - label
              - tag
              - type
              - choices
        tags:
          type: array
          description: The summary counts of the list.
          items:
            type: string
            example: welcome
        counts:
          type: array
          description: The summary counts of the list.
          items:
            type: object
            properties:
              pending:
                type: integer
                description: The number of pending contacts in the list.
                example: 0
              subscribed:
                type: integer
                description: The number of subscribed contacts in the list.
                example: 0
              unsubscribed:
                type: integer
                description: The number of unsubscribed contacts in the list.
                example: 0
        created_at:
          type: string
          description: When the list was created, in ISO 8601 format.
          example: '2015-12-01T12:59:37+00:00'
        last_updated_at:
          type: string
          description: When the list was updated, in ISO 8601 format.
          example: '2015-12-01T12:59:37+00:00'
      required:
      - name
    PagingNextResource-get:
      type: object
      properties:
        url:
          type: string
          description: Next page url.
          example: https://api.emailoctopus.com/lists?limit=10&starting_after=WyJiOWYyNjA5OC1kZjcxLTExZWUtOTQ4Zi00Yjc0NTg4MjVjYzAiXQ
        starting_after:
          type: string
          description: Cursor that points to the end of the page.
          example: WyJiOWYyNjA5OC1kZjcxLTExZWUtOTQ4Zi00Yjc0NTg4MjVjYzAiXQ
    PagingResource-get:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/PagingNextResource-get'
    List.collection-get:
      type: object
      description: Get a collection of List items.
      properties:
        data:
          type: array
          items:
            title: List
            $ref: '#/components/schemas/List-get'
        paging:
          $ref: '#/components/schemas/PagingResource-get'
  securitySchemes:
    api_key:
      type: http
      description: You can obtain your API key at https://api.emailoctopus.com/developer/api-keys/create
      name: Authorization
      in: header
      scheme: bearer
